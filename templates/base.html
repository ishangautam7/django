<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Manager{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;

                {
                % if request.session.theme=='dark' %
            }

            background-color: #1a1a1a;
            color: #e0e0e0;

                {
                % else %
            }

            background-color: #f4f4f4;
            color: #333;

                {
                % endif %
            }
        }

        nav {
            background-color: #333;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;

                {
                % if request.session.theme=='dark' %
            }

            background: #2d2d2d;

                {
                % else %
            }

            background: white;

                {
                % endif %
            }

            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #555;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .theme-toggle {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        table {
            width: 100%;
        }

        input,
        textarea {
                {
                % if request.session.theme=='dark' %
            }

            background-color: #444;
            color: #e0e0e0;
            border: 1px solid #555;

                {
                % endif %
            }
        }
    </style>
</head>

<body>
    <nav>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'task_list' %}">Tasks</a>
            <a href="{% url 'about' %}">About</a>
        </div>
        <a href="{% url 'toggle_theme' %}" class="theme-toggle">
            {% if request.session.theme == 'dark' %}☀️ Light{% else %}🌙 Dark{% endif %}
        </a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
