{% extends 'base.html' %}

{% block title %}Delete Task{% endblock %}

{% block content %}
<h1>Delete Task</h1>
<p>Are you sure you want to delete "<strong>{{ task.title }}</strong>"?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'task_list' %}" class="btn" style="margin-left:10px;">Cancel</a>
</form>
{% endblock %}
